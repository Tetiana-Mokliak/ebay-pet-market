name: Daily eBay collection

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: ebay-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests==2.32.5

      - name: Collect both searches
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python collect_ebay.py

      - name: Archive snapshots
        if: always()
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          archive_dir = Path("snapshots")
          archive_dir.mkdir(exist_ok=True)

          for folder in Path("data").glob("snapshot_*"):
              if folder.is_dir():
                  shutil.make_archive(
                      str(archive_dir / folder.name),
                      "zip",
                      folder,
                  )
          PY

      - name: Build tables
        if: always()
        run: python build_tables.py

      - name: Save snapshots and tables
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for directory in snapshots tables; do
            if [ -d "$directory" ]; then
              git add "$directory/"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Save eBay snapshot"
            git pull --rebase
            git push
          fi
